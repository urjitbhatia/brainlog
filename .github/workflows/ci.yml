name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: ""
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy -- -D warnings

      - uses: taiki-e/install-action@nextest

      - name: Run tests
        run: cargo nextest run

      # docs/skill/SKILL.md is the copy published on the website. Catch drift
      # here rather than silently shipping a stale skill to visitors.
      - name: Agent skill copy is in sync
        run: |
          if ! diff -u .claude/skills/brainlog-guide/SKILL.md docs/skill/SKILL.md; then
            echo "::error::docs/skill/SKILL.md is out of sync with .claude/skills/brainlog-guide/SKILL.md."
            echo "Run: cp .claude/skills/brainlog-guide/SKILL.md docs/skill/SKILL.md"
            exit 1
          fi
