name: Pages

on:
  push:
    branches: [master]
    paths:
      - "docs/**"
      - ".claude/skills/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Allow the workflow to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy docs/ to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # Publish the agent skill straight from its source of truth so the
      # downloadable copy can never drift from .claude/skills/. Nothing is
      # committed under docs/ — the copy exists only in the built artifact.
      - name: Vendor the agent skill into the site
        run: |
          mkdir -p docs/skill
          cp .claude/skills/brainlog-guide/SKILL.md docs/skill/SKILL.md

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
