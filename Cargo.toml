[package]
name = "brainlog"
version = "0.2.2"
edition = "2021"
description = "Transparent process wrapper that captures stdout, stderr, and stdin with an MCP server for LLM agent access"
license = "MIT"
repository = "https://github.com/urjitbhatia/brainlog"
authors = ["Urjit Bhatia"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
rmcp = { version = "0.16", features = ["server", "transport-io", "macros"] }
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
schemars = "1.0"
nix = { version = "0.29", features = ["signal", "process", "term", "fs"] }
signal-hook = "0.3"
signal-hook-tokio = { version = "0.3", features = ["futures-v0_3"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
anyhow = "1"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio-stream = "0.1"
tokio-util = "0.7"
dirs = "6"
libc = "0.2"
strip-ansi-escapes = "0.2.1"

[dev-dependencies]
tempfile = "3"
